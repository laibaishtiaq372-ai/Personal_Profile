<!DOCTYPE html>
<html>
<head>

    <title>My Personal Profile</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: lightgray;
            margin: 0;
            padding: 30px;
        }

        .profile-card {
            max-width: 600px;
            margin: auto;
            background-color: white;
            padding: 30px;
            border: 2px solid gray;
            border-radius: 15px;
        }

        h1 {
            text-align: center;
            color: darkblue;
        }

        h2 {
            color: blue;
            border-bottom: 2px solid blue;
            padding-bottom: 5px;
        }

        p {
            font-size: 16px;
            line-height: 1.6;
        }

        li {
            margin: 8px;
        }

        a {
            color: blue;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        /* Responsive Design */
        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .profile-card {
                padding: 15px;
            }

            h1 {
                font-size: 25px;
            }
        }

    </style>

</head>

<body>

    <div class="profile-card">

        <h1>Laiba Ishtiaq</h1>

        <h2>About Me</h2>

        <p>
            My name is Laiba Ishtiaq. I am a Software Engineering student.
        </p>

        <p>
            I am interested in programming, web development, and learning
            new technologies. I enjoy creating useful projects.
        </p>

        <h2>My Skills</h2>

        <ul>
            <li>HTML</li>
            <li>CSS</li>
            <li>C++</li>
            <li>Java</li>
        </ul>

        <h2>Contact Me</h2>

        <p>
            Email:
            <a href="mailto:laiba@example.com">
                laiba@example.com
            </a>
        </p>

    </div>

</body>
</html>
